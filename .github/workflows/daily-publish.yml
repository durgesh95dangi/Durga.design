# Rebuilds and deploys durga.design every morning, so blog posts with a future
# `published` date in src/data/blog.json go live on their day automatically.
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN  - token with "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID - your Cloudflare account ID
name: Daily publish
on:
  schedule:
    - cron: '31 0 * * *'   # 00:31 UTC = 06:01 India time
  workflow_dispatch: {}    # "Run workflow" button for a manual publish
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node build/build.mjs
      - run: node build/check.mjs
      - run: npx --yes wrangler@4 pages deploy site --project-name durga-design --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
